{% extends "base.html" %}
{% block content %}
<div class="max-w-sm mx-auto mt-20 bg-white p-6 rounded-lg shadow">
  <h1 class="text-lg font-semibold mb-4">Iniciar sesion</h1>
  {% if error %}
    <p class="text-red-600 text-sm mb-3">{{ error }}</p>
  {% endif %}
  <form method="post" action="/login">
    <input type="password" name="password" placeholder="Clave" autofocus
           class="w-full border rounded px-3 py-2 mb-3" />
    <button type="submit" class="w-full bg-gray-900 text-white rounded px-3 py-2">Entrar</button>
  </form>
</div>
{% endblock %}
